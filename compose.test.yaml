# Compose >= 2.24.4: use independently allocated test ports, stable across restarts.
services:
  postgres:
    ports: !override ["127.0.0.1:${HW03_PG_TEST_PORT:?Use the isolated test runner}:5432"]
  mongodb:
    ports: !override ["127.0.0.1:${HW03_MONGO_TEST_PORT:?Use the isolated test runner}:27017"]
